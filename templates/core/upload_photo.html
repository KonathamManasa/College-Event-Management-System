{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Upload Photo - {{ event.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="d-flex align-items-center mb-4">
            <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-light btn-sm rounded-circle me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h2 class="fw-bold text-white mb-0">Upload Photo</h2>
                <p class="text-light mb-0">For {{ event.title }}</p>
            </div>
        </div>

        <div class="card glass-card border-0">
            <div class="card-body p-4 p-md-5">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill py-2">
                            <i class="bi bi-cloud-upload me-2"></i>Upload Photo
                        </button>
                        <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-light rounded-pill py-2">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
