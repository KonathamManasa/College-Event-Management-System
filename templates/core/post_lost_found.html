{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Post Item - Lost & Found{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-8">
        <div class="glass-card p-4 p-md-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary border-opacity-25 pb-3">
                <h2 class="fw-bold mb-0 text-white">Post Item</h2>
                <a href="{% url 'lost_found_list' %}" class="btn btn-outline-secondary btn-sm rounded-pill">Cancel</a>
            </div>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
