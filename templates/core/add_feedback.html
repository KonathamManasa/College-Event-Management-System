{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Leave Feedback - {{ event.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-star-fill display-1 text-warning"></i>
                <h2 class="fw-bold mt-3 text-white">Event Feedback</h2>
                <p class="text-secondary">Rate your experience at "{{ event.title }}"</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-lg rounded-pill">Submit Feedback</button>
                    <a href="{% url 'event_detail' event.pk %}" class="btn btn-outline-secondary rounded-pill mt-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
