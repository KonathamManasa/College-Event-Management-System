{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Eventure{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5">
            <div class="text-center mb-4">
                <h2 class="fw-bold mb-2">Welcome Back</h2>
                <p class="text-secondary">Sign in to continue to Eventure</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary btn-lg">Login</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-secondary mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
